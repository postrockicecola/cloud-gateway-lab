# Prerequisite: kubectl label node <worker> workload=ai
# Node Label -> nodeSelector -> Scheduler -> Pod placement
apiVersion: v1
kind: Pod
metadata:
  name: node-selector-match
  namespace: gateway-lab
  labels:
    experiment: scheduling
    demo: node-selector
spec:
  restartPolicy: Never
  nodeSelector:
    workload: ai
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
