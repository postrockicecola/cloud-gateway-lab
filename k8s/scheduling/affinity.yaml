# nodeAffinity is a richer form of nodeSelector (In / NotIn / expressions).
# Prerequisite: kubectl label node <worker> workload=ai
apiVersion: v1
kind: Pod
metadata:
  name: affinity-match
  namespace: gateway-lab
  labels:
    experiment: scheduling
    demo: affinity
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: workload
                operator: In
                values:
                  - ai
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
