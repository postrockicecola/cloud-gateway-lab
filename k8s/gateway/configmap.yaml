apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: gateway-lab
data:
  ENDPOINTS_FILE: /etc/gateway/endpoints.yaml
  REDIS_ADDR: redis:6379
  RATE_LIMIT: "10"
  RATE_LIMIT_WINDOW: 1s
  DEFAULT_BALANCE: "10000"
  COMPLETION_RESERVE: "32"
  RETRY_MAX_ATTEMPTS: "3"
  RETRY_BASE_DELAY: 100ms
  BREAKER_THRESHOLD: "2"
  BREAKER_COOLDOWN: 5s
  HEALTH_INTERVAL: 3s
  HEALTH_TIMEOUT: 1s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-endpoints
  namespace: gateway-lab
data:
  endpoints.yaml: |
    models:
      gpt-5:
        - id: mock-a
          provider: openai
          base_url: http://mock-a:8080/v1
          model_name: mock-model
          weight: 3
          region: kind-a
          timeout: 5s
          api_key: ${MOCK_PROVIDER_API_KEY}
        - id: mock-b
          provider: openai
          base_url: http://mock-b:8080/v1
          model_name: mock-model
          weight: 1
          region: kind-b
          timeout: 5s
          api_key: ${MOCK_PROVIDER_API_KEY}
      mock-model:
        - id: model
          provider: openai
          base_url: http://model:8080/v1
          model_name: mock-model
          weight: 1
          region: kind-model
          timeout: 5s
          api_key: ${MOCK_PROVIDER_API_KEY}
